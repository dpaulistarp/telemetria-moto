name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Development signing only. Keep subsequent debug updates compatible.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          python3 scripts/bootstrap-android-tools.py
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdk_status"
      - name: Build, unit tests, instrumentation compilation and lint
        run: ./gradlew assembleDebug testDebugUnitTest :core:telemetry:test :app:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest :core:tracking:assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moto-telemetry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  download:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moto-telemetry-debug
          path: dist
      - name: Publish downloadable debug preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_name="MotoTelemetry-${GITHUB_REF_NAME}-debug.apk"
          cp dist/app-debug.apk "$apk_name"
          sha256sum "$apk_name" > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Prévia Android de desenvolvimento do Moto Telemetry (Android 14+).

          Baixe o arquivo .apk em Assets e abra no celular para instalar.
          Etapa 3: gravação local, serviço de localização em primeiro plano, controles pela notificação,
          pausa/retomada e recuperação de sessão interrompida. Tela bloqueada depende das permissões
          e restrições do Android/fabricante. Métricas completas, eventos, mapa e exportação vêm depois.

          Atualização de APKS de teste: a v0.2.0 usava outra chave de debug. Se o Android recusar a
          atualização, a instalação desta prévia exige remover o app anterior; isso apaga os dados locais.
          A assinatura de desenvolvimento passa a ser preservada no cache da CI, sujeito à retenção do cache.

          Build, testes JVM e lint são verificados antes da publicação.
          Testes Android são compilados; execução e GPS real ainda precisam de aparelho/emulador.
          O APK usa uma assinatura de debug gerada no build, não uma chave de produção.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$apk_name" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Moto Telemetry ${GITHUB_REF_NAME} — Android debug" \
            --notes-file release-notes.md
