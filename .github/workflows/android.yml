name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, unit tests, instrumentation compilation and lint
        run: ./gradlew assembleDebug testDebugUnitTest :core:telemetry:test :app:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest :core:tracking:assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moto-telemetry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
